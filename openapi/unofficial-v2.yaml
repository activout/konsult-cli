openapi: 3.0.3
info:
  title: Brainville API v2 (unofficial, community-authored)
  version: 0.1.0-unofficial
  description: |
    Community-authored, UNOFFICIAL description of the Brainville API v2, written for the `konsult` CLI.
    Not published, reviewed or endorsed by Brainville AB. Based on the public developer documentation
    and limited sandbox observations. `x-verification-status` marks the evidence per operation:
    documented | sandbox-verified | inferred | unknown | blocked. Unknown fields must be tolerated.
servers:
  - url: https://apisandbox.brainville.com/v2
    description: Sandbox
  - url: https://api.brainville.com/v2
    description: Production
security:
  - brainvilleBearer: []
components:
  securitySchemes:
    brainvilleBearer:
      type: http
      scheme: bearer
      description: Token is base64(userKey + ":" + senderKey), not OAuth. Verified in the sandbox.
  schemas:
    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              errorCode: {type: integer, description: "0 unknown, 1 not found, 2 missing value, 3 invalid value, 4 duplicate, 5 not permitted, 6 incorrect payment details"}
              message: {type: string}
              field: {type: string}
    Extent:
      type: object
      properties:
        type: {type: integer, description: "1 percentage, 2 fixed hours, 3 hours/week (documented)"}
        value: {type: number}
    MaxRate:
      type: object
      description: Documented input uses `amount`; some documented outputs use `rate` (unverified).
      additionalProperties: true
      properties:
        amount: {type: number}
        rate: {type: number}
        type: {type: string}
        display: {type: string}
        currency: {type: string}
    Location:
      type: object
      properties:
        countryId: {type: integer}
        regionId: {type: integer}
        city: {type: string}
    Assignment:
      type: object
      additionalProperties: true
      description: 'Required in practice on create (sandbox): title, text, competenceAreaId, level, extent, locations.'
      properties:
        id: {type: integer}
        title: {type: string, maxLength: 100}
        text: {type: string, maxLength: 10000, description: Limited HTML}
        assignmentStartDate: {type: string, nullable: true}
        assignmentEndDate: {type: string, nullable: true}
        optionDate: {type: string, nullable: true}
        publicationEndDate: {type: string, nullable: true, description: Omit on create for a draft; must be in the future}
        competenceAreaId: {type: integer}
        level: {type: string, enum: [Low, Medium, High, Advanced, Expert]}
        extent: {$ref: '#/components/schemas/Extent'}
        maxRate: {allOf: [{$ref: '#/components/schemas/MaxRate'}], nullable: true}
        locations: {type: array, items: {$ref: '#/components/schemas/Location'}}
        roles: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
        allowRemote: {type: string, description: "No, Yes or Partly (documented)"}
        acceptSubcontractors: {type: boolean}
        category: {type: string}
        endClientStatus: {type: string}
        noDelay: {type: boolean, description: May be chargeable}
    Consultant:
      type: object
      additionalProperties: true
      properties:
        id: {type: integer}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string}
    Application:
      type: object
      additionalProperties: true
      properties:
        id: {type: integer}
        assignmentId: {type: integer}
        status: {type: string, description: "Pending Accepted Rejected Negotiating Approved RequestAdditions (documented)"}
    Any:
      type: object
      additionalProperties: true
  responses:
    Error:
      description: Error
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Ok:
      description: Success
paths:
  /market/search:
    post:
      summary: Search the marketplace (consumes export quota; excludes own assignments)
      x-verification-status: sandbox-verified
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Any'}}}}
      responses:
        '200': {description: "{results, exportedInPeriod, volume, period, actualResultCount}", content: {application/json: {schema: {$ref: '#/components/schemas/Any'}}}}
        default: {$ref: '#/components/responses/Error'}
  /market:
    get:
      summary: Get marketplace assignments by comma-separated ids (max 100); same envelope as search plus accountEmail
      x-verification-status: sandbox-verified
      parameters: [{name: id, in: query, required: true, schema: {type: string}}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Any'}}}}
        default: {$ref: '#/components/responses/Error'}
  /assignment:
    get:
      summary: List or get own assignments (always an array)
      x-verification-status: sandbox-verified
      parameters:
        - {name: id, in: query, schema: {type: string}}
        - {name: startdate, in: query, schema: {type: string}}
        - {name: enddate, in: query, schema: {type: string}}
        - {name: phrase, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}, description: 'Valid values unknown (draft is rejected)'}
        - {name: includeclosed, in: query, schema: {type: boolean}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Create an assignment (draft when publicationEndDate is omitted)
      x-verification-status: sandbox-verified
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
      responses:
        '200': {description: "{id, message}", content: {application/json: {schema: {$ref: '#/components/schemas/Any'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      summary: Update an assignment
      x-verification-status: documented
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
      responses: {'200': {$ref: '#/components/responses/Ok'}, default: {$ref: '#/components/responses/Error'}}
  /assignment/delete:
    delete:
      summary: Delete a never-published assignment
      description: Sandbox-verified. id must be in the query (a body-only id gives 400).
      x-verification-status: sandbox-verified
      parameters: [{name: id, in: query, required: true, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/Ok'}, default: {$ref: '#/components/responses/Error'}}
  /assignment/unpublish:
    post:
      summary: Unpublish an assignment
      x-verification-status: sandbox-verified
      parameters: [{name: id, in: query, required: true, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/Ok'}, default: {$ref: '#/components/responses/Error'}}
  /assignment/close:
    post:
      summary: Close (unpublishes, rejects pending applications, emails applicants)
      x-verification-status: sandbox-verified
      description: id must be in the query (body-only gives 404). Send an empty body.
      parameters: [{name: id, in: query, required: true, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/Ok'}, default: {$ref: '#/components/responses/Error'}}
  /assignmentfile:
    get:
      summary: Download an attachment
      x-verification-status: sandbox-verified
      parameters: [{name: id, in: query, required: true, schema: {type: string}}, {name: fileName, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Binary stream, content: {application/octet-stream: {schema: {type: string, format: binary}}}}, default: {$ref: '#/components/responses/Error'}}
    post:
      summary: Add or replace an attachment (returns 201)
      x-verification-status: sandbox-verified
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {id: {type: integer}, fileName: {type: string}, data: {type: string, format: byte}}}}}}
      responses: {'200': {$ref: '#/components/responses/Ok'}, default: {$ref: '#/components/responses/Error'}}
    delete:
      summary: Delete an attachment (JSON body on DELETE works)
      x-verification-status: sandbox-verified
      requestBody: {content: {application/json: {schema: {type: object, properties: {id: {type: integer}, fileName: {type: string}}}}}}
      responses: {'200': {$ref: '#/components/responses/Ok'}, default: {$ref: '#/components/responses/Error'}}
  /assignment/suggestedtags:
    post:
      summary: Suggest tags (read-only)
      x-verification-status: documented
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {text: {type: string}}}}}}
      responses: {'200': {description: Array of strings, content: {application/json: {schema: {type: array, items: {type: string}}}}}, default: {$ref: '#/components/responses/Error'}}
  /application:
    get:
      summary: List or get applications (401 in the sandbox, licence or role)
      x-verification-status: blocked
      parameters:
        - {name: id, in: query, schema: {type: string}}
        - {name: assignmentId, in: query, schema: {type: string}}
        - {name: requestorId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: startDate, in: query, schema: {type: string}}
        - {name: endDate, in: query, schema: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Application'}}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      summary: Change application status
      x-verification-status: blocked
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status]
              properties:
                id: {type: integer}
                status: {type: string}
                reply: {type: string}
                rejectReason: {type: string}
      responses: {'200': {$ref: '#/components/responses/Ok'}, default: {$ref: '#/components/responses/Error'}}
  /application/resume:
    get:
      summary: Download the CV (PDF)
      x-verification-status: blocked
      parameters: [{name: id, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: PDF, content: {application/pdf: {schema: {type: string, format: binary}}}}, default: {$ref: '#/components/responses/Error'}}
  /application/file:
    get:
      summary: Download an application attachment
      x-verification-status: blocked
      parameters:
        - {name: id, in: query, required: true, schema: {type: string}}
        - {name: fileindex, in: query, schema: {type: integer}}
        - {name: filename, in: query, schema: {type: string}}
      responses: {'200': {description: File stream, content: {application/octet-stream: {schema: {type: string, format: binary}}}}, default: {$ref: '#/components/responses/Error'}}
  /consultant:
    get:
      summary: List consultants, or get a full profile with id (number or email)
      x-verification-status: sandbox-verified
      parameters: [{name: id, in: query, schema: {type: string}}, {name: query, in: query, schema: {type: string}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Consultant'}}}}}, default: {$ref: '#/components/responses/Error'}}
    post:
      summary: Create a consultant
      x-verification-status: sandbox-verified
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Consultant'}}}}
      responses: {'200': {$ref: '#/components/responses/Ok'}, default: {$ref: '#/components/responses/Error'}}
    put:
      summary: Update a consultant (partial update observed)
      x-verification-status: sandbox-verified
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Consultant'}}}}
      responses: {'200': {$ref: '#/components/responses/Ok'}, default: {$ref: '#/components/responses/Error'}}
    delete:
      summary: Delete a consultant
      description: id in the query (body-only gives 405).
      x-verification-status: sandbox-verified
      parameters: [{name: id, in: query, required: true, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/Ok'}, default: {$ref: '#/components/responses/Error'}}
  /consultant/share:
    post:
      summary: Share a profile on the marketplace (id and active in the query; the effect is not readable)
      x-verification-status: sandbox-verified
      parameters: [{name: id, in: query, required: true, schema: {type: string}}, {name: active, in: query, schema: {type: boolean, default: true}}]
      responses: {'200': {$ref: '#/components/responses/Ok'}, default: {$ref: '#/components/responses/Error'}}
  /consultant/boost:
    post:
      summary: Boost a profile (paid). id and active in the query. active=false returns 200; on returned 404 in the sandbox (unresolved).
      x-verification-status: unknown
      parameters: [{name: id, in: query, required: true, schema: {type: string}}, {name: active, in: query, schema: {type: boolean, default: true}}]
      responses: {'200': {$ref: '#/components/responses/Ok'}, default: {$ref: '#/components/responses/Error'}}
