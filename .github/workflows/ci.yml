name: ci
on:
  push:
    branches: [main]
  pull_request:
# Offline tests only: no Brainville credentials, no sandbox calls, nothing quota-consuming.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go vet ./...
      - run: go test ./...
