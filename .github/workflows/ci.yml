name: ci
on:
  push:
    branches: [main]
  pull_request:
# Offline tests only: no Brainville credentials, no sandbox calls, nothing quota-consuming.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: go vet ./...
      - run: go test ./...
  # Dependabot PRs merge themselves once the tests above pass.
  automerge:
    needs: test
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - env: {GH_TOKEN: '${{ github.token }}', PR_URL: '${{ github.event.pull_request.html_url }}'}
        run: gh pr merge --squash "$PR_URL"
