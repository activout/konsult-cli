name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go test ./...
      - name: Build static binaries
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ $os = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/konsult$ext ./cmd/konsult
            if [ $os = windows ]; then (cd dist && zip -q konsult_${os}_${arch}.zip konsult.exe); else tar -C dist -czf dist/konsult_${os}_${arch}.tar.gz konsult; fi
            rm dist/konsult$ext
          done
          (cd dist && sha256sum * > checksums.txt)
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
